<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S242 SYNERGY Calc | NOBODY</title>
    <style>
        :root {
            --primary-color: #3498db;
            --accent-color: #e67e22;
            --bg-color: #1a1c20;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; line-height: 1.6; background-color: var(--bg-color); color: var(--text-main); }
        .container { max-width: 900px; margin: auto; display: flex; flex-direction: column; gap: 20px; }
        
        .header-credit { text-align: right; color: #aaa; font-size: 0.8em; margin-bottom: -10px; letter-spacing: 1px; }
        .header-credit b { color: var(--primary-color); }

        .calc-card { background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 5px solid var(--primary-color); }
        h2 { text-align: center; color: var(--text-main); margin-bottom: 25px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.85em; color: #666; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #eee; background-color: #fff; cursor: pointer; font-size: 14px; transition: 0.3s; }
        select:focus { border-color: var(--primary-color); outline: none; }
        
        .result-box { margin-top: 30px; padding: 25px; background: #f8faff; border-radius: 15px; text-align: center; border: 2px dashed #d1e9ff; }
        .result-label { font-size: 0.9em; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .total { font-size: 2.2em; font-weight: 900; color: var(--primary-color); margin-top: 5px; }
        
        .table-card { background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h3 { color: var(--text-main); font-size: 1.1em; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        h3::before { content: ''; width: 4px; height: 18px; background: var(--primary-color); display: inline-block; }
        
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; min-width: 600px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        th { background-color: #fcfcfc; color: #333; font-weight: 700; text-transform: uppercase; }
        .highlight-tower { font-weight: bold; color: var(--accent-color); }
        .highlight-pre { text-align: left; color: #e67e22; font-size: 0.9em; }

        .footer-credit { text-align: center; margin-top: 20px; padding: 20px; color: #666; font-size: 0.9em; border-top: 1px solid #333; }
        .footer-credit b { color: #fff; background: var(--primary-color); padding: 2px 8px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-credit">SYSTEM DESIGNED BY <b>NOBODY (S242)</b></div>
    
    <div class="calc-card">
        <h2>Watch Tower Calc</h2>
        <div class="grid-inputs">
            <div class="input-group full-width">
                <label>목표 산업 레벨 (Target Industrial Level)</label>
                <select id="targetLvl" onchange="calculate()"></select>
            </div>
            <div class="input-group"><label>현재 타워 (Watch Tower)</label><select id="curTower" onchange="calculate()"></select></div>
            <div class="input-group"><label>현재 연맹홀 (Guild)</label><select id="curGuild" onchange="calculate()"></select></div>
            <div class="input-group"><label>현재 슈터 (Shooter)</label><select id="curShooter" onchange="calculate()"></select></div>
            <div class="input-group"><label>현재 라이더 (Rider)</label><select id="curRider" onchange="calculate()"></select></div>
            <div class="input-group"><label>현재 파이터 (Fighter)</label><select id="curFighter" onchange="calculate()"></select></div>
        </div>

        <div class="result-box">
            <div class="result-label">Total Precision Parts Required</div>
            <div class="total" id="result">0</div>
        </div>
    </div>

    <div class="table-card">
        <h3>Reference Data & Prerequisites</h3>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Level</th>
                        <th>Watch Tower</th>
                        <th>Guild</th>
                        <th>Troop Camp</th>
                        <th style="text-align:left">Prerequisite (선행조건)</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="footer-credit">
        Made by <b>NOBODY (S242)</b> | Optimized for 242 & SYNERGY
    </div>
</div>

<script>
    const data = {
        tower: [0, 900, 1100, 1300, 1550, 1850, 1500, 1600, 1750],
        guild: [0, 250, 250, 300, 350, 450, 350, 400, 500],
        camp:  [0, 400, 450, 550, 650, 800, 600, 700, 800]
    };

    const preReqs = [
        "-", "-",
        "산업1 연맹홀 + 산업1 슈터",
        "산업2 연맹홀 + 산업2 라이더",
        "산업3 연맹홀 + 산업3 파이터",
        "산업4 연맹홀 + 산업4 슈터",
        "산업5 연맹홀 + 산업5 라이더",
        "산업6 연맹홀 + 산업6 파이터",
        "산업7 연맹홀 + 산업7 슈터"
    ];

    function getRequiredCampLvl(target, type) {
        if (target < 2) return 0;
        const reqLvl = target - 1;
        if (type === 'shooter') return [1, 4, 7].includes(reqLvl) ? reqLvl : (reqLvl > 7 ? 7 : (reqLvl > 4 ? 4 : (reqLvl > 1 ? 1 : 0)));
        if (type === 'rider') return [2, 5].includes(reqLvl) ? reqLvl : (reqLvl > 5 ? 5 : (reqLvl > 2 ? 2 : 0));
        if (type === 'fighter') return [3, 6].includes(reqLvl) ? reqLvl : (reqLvl > 6 ? 6 : (reqLvl > 3 ? 3 : 0));
        return 0;
    }

    function init() {
        const ids = ['targetLvl', 'curTower', 'curGuild', 'curShooter', 'curRider', 'curFighter'];
        ids.forEach(id => {
            const el = document.getElementById(id);
            for(let i=0; i<=8; i++) {
                if(id === 'targetLvl' && i === 0) continue;
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = (i === 0) ? '0 레벨' : '산업' + i;
                el.appendChild(opt);
            }
        });

        const tbody = document.getElementById('dataTableBody');
        for(let i=1; i<=8; i++) {
            tbody.innerHTML += `<tr>
                <td>산업${i}</td>
                <td class="highlight-tower">${data.tower[i].toLocaleString()}</td>
                <td>${data.guild[i].toLocaleString()}</td>
                <td>${data.camp[i].toLocaleString()}</td>
                <td class="highlight-pre">${preReqs[i]}</td>
            </tr>`;
        }
    }

    function calculate() {
        const target = parseInt(document.getElementById('targetLvl').value);
        const cur = {
            tower: parseInt(document.getElementById('curTower').value),
            guild: parseInt(document.getElementById('curGuild').value),
            shooter: parseInt(document.getElementById('curShooter').value),
            rider: parseInt(document.getElementById('curRider').value),
            fighter: parseInt(document.getElementById('curFighter').value)
        };

        let total = 0;
        for (let i = cur.tower + 1; i <= target; i++) total += data.tower[i];
        if (target >= 2) {
            for (let i = cur.guild + 1; i <= target - 1; i++) total += data.guild[i];
            const reqS = getRequiredCampLvl(target, 'shooter');
            const reqR = getRequiredCampLvl(target, 'rider');
            const reqF = getRequiredCampLvl(target, 'fighter');
            for (let i = cur.shooter + 1; i <= reqS; i++) total += data.camp[i];
            for (let i = cur.rider + 1; i <= reqR; i++) total += data.camp[i];
            for (let i = cur.fighter + 1; i <= reqF; i++) total += data.camp[i];
        }
        document.getElementById('result').innerText = total.toLocaleString();
    }

    init();
    calculate();
</script>
</body>
</html>
