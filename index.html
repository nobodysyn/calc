<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>와치타워 부품 계산기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; line-height: 1.6; background-color: #f0f2f5; }
        .container { max-width: 900px; margin: auto; display: flex; flex-direction: column; gap: 20px; }
        .calc-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-group { margin-bottom: 15px; }
        .full-width { grid-column: span 2; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.85em; color: #555; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; background-color: #fff; cursor: pointer; }
        .result-box { margin-top: 25px; padding: 20px; background: #eef7ff; border-radius: 10px; text-align: center; border: 1px solid #d1e9ff; }
        .total { font-size: 1.8em; font-weight: bold; color: #007bff; }
        
        /* 테이블 스타일 */
        .table-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82em; text-align: center; min-width: 600px; }
        th, td { padding: 12px 8px; border: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #333; font-weight: bold; }
        .highlight-tower { background-color: #fff4e6; font-weight: bold; }
        .highlight-pre { background-color: #fff9db; text-align: left; padding-left: 15px; color: #d9480f; }
        .footer-note { font-size: 0.75em; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="calc-card">
        <h2>Watch Tower Calculator</h2>
        <div class="grid-inputs">
            <div class="input-group full-width">
                <label>목표 산업 레벨 (Target Level)</label>
                <select id="targetLvl" onchange="calculate()"></select>
            </div>
            <div class="input-group"><label>현재 타워 (Watch Tower)</label><select id="curTower" onchange="calculate()"></select></div>
            <div class="input-group"><label>현재 연맹홀 (Guild)</label><select id="curGuild" onchange="calculate()"></select></div>
            <div class="input-group"><label>현재 슈터 (Shooter)</label><select id="curShooter" onchange="calculate()"></select></div>
            <div class="input-group"><label>현재 라이더 (Rider)</label><select id="curRider" onchange="calculate()"></select></div>
            <div class="input-group"><label>현재 파이터 (Fighter)</label><select id="curFighter" onchange="calculate()"></select></div>
        </div>

        <div class="result-box">
            <div style="font-size: 0.9em; color: #666;">필요한 총 정밀 부품 (Precision Parts)</div>
            <div class="total" id="result">0</div>
        </div>
    </div>

    <div class="table-card">
        <h3 style="text-align: center; color: #444; margin-bottom: 15px;">[참조 데이터] 레벨별 소모 부품 및 선행조건</h3>
        <table>
            <thead>
                <tr>
                    <th>구분</th>
                    <th class="highlight-tower">Watch Tower</th>
                    <th>Guild</th>
                    <th>Troop Camp</th>
                    <th class="highlight-pre">선행조건 (Prerequisite)</th>
                </tr>
            </thead>
            <tbody id="dataTableBody">
                </tbody>
        </table>
        <p class="footer-note">* 병종 캠프(슈터/라이더/파이터)의 레벨별 소모량은 동일합니다.</p>
        <p class="footer-note">* 선행조건 로테이션: 슈터 → 라이더 → 파이터 순으로 순환합니다.</p>
    </div>
</div>

<script>
    // 원본 데이터
    const data = {
        tower: [0, 900, 1100, 1300, 1550, 1850, 1500, 1600, 1750],
        guild: [0, 250, 250, 300, 350, 450, 350, 400, 500],
        camp:  [0, 400, 450, 550, 650, 800, 600, 700, 800]
    };

    // 선행조건 텍스트 생성
    const preReqs = [
        "-",
        "-",
        "산업1 연맹홀 + 산업1 슈터",
        "산업2 연맹홀 + 산업2 라이더",
        "산업3 연맹홀 + 산업3 파이터",
        "산업4 연맹홀 + 산업4 슈터",
        "산업5 연맹홀 + 산업5 라이더",
        "산업6 연맹홀 + 산업6 파이터",
        "산업7 연맹홀 + 산업7 슈터"
    ];

    function getRequiredCampLvl(target, type) {
        if (target < 2) return 0;
        const reqLvl = target - 1;
        if (type === 'shooter') {
            if (reqLvl >= 7) return 7;
            if (reqLvl >= 4) return 4;
            if (reqLvl >= 1) return 1;
        }
        if (type === 'rider') {
            if (reqLvl >= 5) return 5;
            if (reqLvl >= 2) return 2;
        }
        if (type === 'fighter') {
            if (reqLvl >= 6) return 6;
            if (reqLvl >= 3) return 3;
        }
        return 0;
    }

    function init() {
        const ids = ['targetLvl', 'curTower', 'curGuild', 'curShooter', 'curRider', 'curFighter'];
        ids.forEach(id => {
            const el = document.getElementById(id);
            for(let i=0; i<=8; i++) {
                if(id === 'targetLvl' && i === 0) continue;
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = (i === 0) ? '0 레벨' : '산업' + i;
                el.appendChild(opt);
            }
        });

        const tbody = document.getElementById('dataTableBody');
        for(let i=1; i<=8; i++) {
            let row = `<tr>
                <td>산업${i}</td>
                <td class="highlight-tower">${data.tower[i].toLocaleString()}</td>
                <td>${data.guild[i].toLocaleString()}</td>
                <td>${data.camp[i].toLocaleString()}</td>
                <td class="highlight-pre">${preReqs[i]}</td>
            </tr>`;
            tbody.innerHTML += row;
        }
    }

    function calculate() {
        const target = parseInt(document.getElementById('targetLvl').value);
        const cur = {
            tower: parseInt(document.getElementById('curTower').value),
            guild: parseInt(document.getElementById('curGuild').value),
            shooter: parseInt(document.getElementById('curShooter').value),
            rider: parseInt(document.getElementById('curRider').value),
            fighter: parseInt(document.getElementById('curFighter').value)
        };

        let total = 0;
        for (let i = cur.tower + 1; i <= target; i++) total += data.tower[i];
        if (target >= 2) {
            for (let i = cur.guild + 1; i <= target - 1; i++) total += data.guild[i];
            const reqS = getRequiredCampLvl(target, 'shooter');
            const reqR = getRequiredCampLvl(target, 'rider');
            const reqF = getRequiredCampLvl(target, 'fighter');
            for (let i = cur.shooter + 1; i <= reqS; i++) total += data.camp[i];
            for (let i = cur.rider + 1; i <= reqR; i++) total += data.camp[i];
            for (let i = cur.fighter + 1; i <= reqF; i++) total += data.camp[i];
        }
        document.getElementById('result').innerText = total.toLocaleString() + " 개";
    }

    init();
    calculate();
</script>
</body>
</html>
